<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ERP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mini ERP</h1>

    <div class="top-container">

        <!-- Lisää uusi tuote -->

        <section class="card">

            <h2>Lisää uusi tuote</h2>

            <form id="productForm">

                <label for="productName">
                    Tuotteen nimi
                </label>

                <input
                    id="productName"
                    type="text"
                    required>

                <label for="quantity">
                    Määrä
                </label>

                <input
                    id="quantity"
                    type="number"
                    min="0"
                    required>

                <label for="price">
                    Hinta (€)
                </label>

                <input
                    id="price"
                    type="number"
                    min="0"
                    step="0.01"
                    required>

                <button
                    id="addProductButton"
                    type="submit">

                    Lisää tuote

                </button>

            </form>

        </section>

        <!-- Haku -->

        <section class="card">

            <h2>Haku</h2>

            <input
                id="searchInput"
                type="text"
                placeholder="Hae tuotetta">

        </section>

    </div>

    <!-- Tuotetaulukko -->

    <section class="card">

        <h2>Tuotteet</h2>

        <table id="productTable">

            <thead>

                <tr>

                    <th>Tuote</th>
                    <th>Määrä</th>
                    <th>Hinta (€)</th>
                    <th>Toiminnot</th>

                </tr>

            </thead>

            <tbody id="productTableBody">

                <!-- JavaScript lisää tuotteet tähän -->

            </tbody>

        </table>

    </section>

    <script src="script.js"></script>

</body>

</html>
