<!DOCTYPE html>
<html lang="fi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mini ERP</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <h1>Mini ERP</h1>

    <section>

        <h2>Lisää uusi tuote</h2>

        <form>

            <label for="productName">
                Tuotteen nimi
            </label>

            <input
                id="productName"
                type="text">

            <label for="quantity">
                Määrä
            </label>

            <input
                id="quantity"
                type="number">

            <label for="price">
                Hinta (€)
            </label>

            <input
                id="price"
                type="number"
                step="0.01">

            <button>

                Lisää tuote

            </button>

        </form>

    </section>

    <section>

        <h2>Haku</h2>

        <input
            type="text"
            placeholder="Hae tuotetta">

    </section>

    <section>

        <h2>Tuotteet</h2>

        <table>

            <thead>

                <tr>

                    <th>Tuote</th>

                    <th>Määrä</th>

                    <th>Hinta</th>

                    <th>Toiminnot</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </section>

    <script src="script.js"></script>

</body>

</html>
