<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini ERP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Mini ERP</h1>

    <form id="productForm">

        <label for="productName">Tuote</label>
        <input
            type="text"
            id="productName"
            required
        >

        <label for="quantity">Määrä</label>
        <input
            type="number"
            id="quantity"
            required
        >

        <label for="price">Hinta (€)</label>
        <input
            type="number"
            id="price"
            step="0.01"
            required
        >

        <button type="submit">
            Lisää tuote
        </button>

    </form>

    <br>

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Hae tuotteita..."
    >

    <!-- DASHBOARD -->

    <section class="dashboard">

        <div class="card">
            <h3>📦 Tuotteita</h3>
            <p id="productCount">0</p>
        </div>

        <div class="card">
            <h3>📦 Kpl yhteensä</h3>
            <p id="totalQuantity">0</p>
        </div>

        <div class="card">
            <h3>💰 Varaston arvo</h3>
            <p id="inventoryValue">0 €</p>
        </div>

        <div class="card">
            <h3>💵 Keskihinta</h3>
            <p id="averagePrice">0 €</p>
        </div>

    </section>

    <table>

        <thead>

            <tr>
                <th>Tuote</th>
                <th>Määrä</th>
                <th>Hinta</th>
                <th>Toiminnot</th>
            </tr>

        </thead>

        <tbody id="productTableBody">

        </tbody>

    </table>

    <script src="script.js"></script>

</body>
</html>
